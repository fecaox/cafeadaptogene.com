name: Déployer sur Obambu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-obambu
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm

      - name: Installer PHP et Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2

      - name: Installer les dépendances du site
        run: npm ci

      - name: Installer le serveur MCP
        working-directory: mcp-server
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Vérifier le site
        run: |
          npm run build
          npm run build:github
          npm run lint
          node --test tests/*.test.mjs
          for test in mcp-server/tests/*Test.php; do php "$test"; done

      - name: Vérifier le protocole MCP par HTTP
        run: |
          php -S 127.0.0.1:8765 mcp-server/public/index.php >/tmp/cafeadaptogene-mcp.log 2>&1 &
          bash mcp-server/tests/http-smoke.sh

      - name: Ajouter le serveur MCP à la publication
        run: node scripts/package-mcp-server.mjs

      - name: Publier la version statique sur Obambu
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ./
          log-level: minimal
          security: strict
