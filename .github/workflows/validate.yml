name: Vérifier cafeadaptogene.com

on:
  push:
    branches: [main, feat/agent-ready-mcp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:github
      - run: node --test tests/rendered-html.test.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - run: php mcp-server/tests/KnowledgeBaseTest.php
      - name: Démarrer le serveur MCP local
        run: php -S 127.0.0.1:8765 mcp-server/public/index.php >/tmp/cafeadaptogene-mcp.log 2>&1 &
      - name: Vérifier le protocole MCP par HTTP
        run: bash mcp-server/tests/http-smoke.sh
