name: Vérifier cafeadaptogene.com

on:
  push:
    branches: [main, fix/production-mcp-endpoint]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
      - run: npm ci
      - name: Installer le serveur MCP
        working-directory: mcp-server
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Tester le serveur MCP PHP
        run: for test in mcp-server/tests/*Test.php; do php "$test"; done
      - run: npm run build
      - run: npm run build:github
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - name: Démarrer le serveur MCP local
        run: php -S 127.0.0.1:8765 mcp-server/public/index.php >/tmp/cafeadaptogene-mcp.log 2>&1 &
      - name: Vérifier le protocole MCP par HTTP
        run: bash mcp-server/tests/http-smoke.sh
